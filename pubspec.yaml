name: contacts_app
description: Contacts App with Firebase Authentication and Cloud Firestore
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase core - bắt buộc phải có
  firebase_core: ^3.1.0

  # Firebase Authentication
  firebase_auth: ^5.1.0

  # Cloud Firestore - lưu trữ contacts
  cloud_firestore: ^5.1.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # Icon mặc định của Flutter
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
